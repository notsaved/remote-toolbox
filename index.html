<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧰 Remote Toolbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #fff; color: #000; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 20px; margin-bottom: 20px; border-bottom: 1px solid #000; padding-bottom: 10px; }
        h2 { font-size: 14px; margin-bottom: 10px; }
        .tool { margin-bottom: 30px; }
        input, select, textarea, button { padding: 8px; border: 1px solid #000; font-family: monospace; }
        textarea { width: 100%; height: 150px; resize: vertical; position: relative; }
        .input-wrapper { position: relative; }
        .stats { position: absolute; bottom: 8px; right: 8px; font-size: 11px; text-align: right; line-height: 1.4; background: #fff; }
        .buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        button { cursor: pointer; font-size: 13px; background: #fff; width: auto; }
        button:hover { background: #000; color: #fff; }
        .grid { display: grid; gap: 10px; }
        .qrInput { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .qrInput-full { grid-column: 1 / -1; }
        .hidden { display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🧰 Remote Toolbox</h1>
        
        <div class="tool">
            <h2>⌨️ Text Formatting</h2>
            <div class="input-wrapper">
                <textarea id="input" placeholder="Paste text..."></textarea>
                <div class="stats" id="stats">0 chars<br>0 words</div>
            </div>
            <div class="buttons">
                <button onclick="paste()" title="Paste">📋</button>
                <button onclick="transform(x => x.toUpperCase())" title="UPPERCASE">A</button>
                <button onclick="transform(x => x.toLowerCase())" title="lowercase">a</button>
                <button onclick="transform(x => x.replace(/  +/g, ' '))" title="Remove Double Spaces">No _</button>
                <button onclick="transform(x => x.split('').join(' '))" title="Insert Single Spaces">Add _</button>
                <button onclick="transform(x => x.replace(/\n/g, ' '))" title="Remove Line Breaks">No ↵</button>
                <button onclick="transform(x => x.split(/\s+/).filter(w => w).join('\n'))" title="One Word Per Line">Add ↵</button>
                <button onclick="transform(x => x.replace(/[^\w\s]/g, ''))" title="Remove Punctuation">No ."?</button>
                <button onclick="transform(x => x.normalize('NFD').replace(/[\u0300-\u036f]/g, ''))" title="Remove Pinyin Tones">No àā</button>
                <button onclick="removeTracking()" title="Remove Link UTM">No 🔗</button>
                <button onclick="sortLines()" title="Sort A-Z">⇅ A-Z</button>
                <button onclick="copy()" title="Copy">📑</button>
                <button onclick="input.value='';updateStats()" title="Clear">🗑️</button>
            </div>
        </div>

        <div class="tool">
            <h2>📅 Calendar Event</h2>
            <div class="grid">
                <input type="text" id="eventTitle" placeholder="Title">
                <select id="durationType" onchange="toggleDurationOptions()">
                    <option value="hours">Timed Event</option>
                    <option value="allday">All Day</option>
                    <option value="days">Multi-day</option>
                </select>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <input type="date" id="eventDate">
                    <input type="time" id="eventTime" class="timeContainer">
                    <input type="date" id="eventEndDate" class="endDateContainer hidden">
                </div>
                <button onclick="generateICS()">📥 .ics</button>
            </div>
        </div>

        <div class="tool">
            <h2>🖼️ Image Converter</h2>
            <div class="grid">
                <div id="imageDropZone" style="border: 2px dashed #000; padding: 30px; text-align: center; cursor: pointer; background: #fafafa;" ondrop="handleDrop(event)" ondragover="event.preventDefault()" onclick="document.getElementById('imageInput').click()">
                    Image upload
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                <img id="imagePreview" style="display: none; max-width: 100%; max-height: 200px;">
                <div id="imageControls" style="display: none;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <input type="number" id="imageWidth" placeholder="Width (px)" min="1">
                        <input type="number" id="imageHeight" placeholder="Height (px)" min="1">
                    </div>
                </div>
                <div id="imageButtons" class="buttons" style="display: none;">
                    <button onclick="convertImage('jpg')" title="Save as JPG">📥 JPG</button>
                    <button onclick="convertImage('png')" title="Save as PNG">📥 PNG</button>
                </div>
            </div>
        </div>

        <div class="tool">
            <h2>🔳 QR Code Generator</h2>
            <div class="grid">
                <select id="qrType" onchange="toggleQrInputs()">
                    <option value="text">Text/Link</option>
                    <option value="vcard">Contact</option>
                    <option value="wifi">WiFi</option>
                    <option value="event">Event</option>
                </select>
                
                <textarea id="qrTextInput" placeholder="Enter text..." class="qrInput"></textarea>
                
                <div id="qrVcardInputs" class="qrInput hidden">
                    <input type="text" id="vcardName" placeholder="Full Name">
                    <input type="tel" id="vcardPhone" placeholder="Phone Number">
                    <input type="email" id="vcardEmail" placeholder="E-mail Address">
                    <input type="text" id="vcardOrg" placeholder="Organization (optional)">
                    <input type="url" id="vcardUrl" placeholder="Website (optional)">
                </div>
                
                <div id="qrWifiInputs" class="qrInput hidden">
                    <input type="text" id="wifiName" placeholder="Network Name (SSID)">
                    <input type="password" id="wifiPassword" placeholder="Password">
                    <select id="wifiSecurity">
                        <option value="WPA">WPA</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">Open</option>
                    </select>
                </div>
                
                <div id="qrEventInputs" class="qrInput hidden">
                    <input type="text" id="eventTitle" placeholder="Event Title" class="qrInput-full">
                    <input type="text" id="eventDesc" placeholder="Description (optional)" class="qrInput-full">
                    <input type="datetime-local" id="eventStart" placeholder="Start Date/Time">
                    <input type="datetime-local" id="eventEnd" placeholder="End Date/Time">
                </div>
                
                <div class="buttons">
                    <button onclick="generateQR()" title="Generate Preview">𖣯</button>
                    <button onclick="downloadQR()" title="Download 1024x1024">📥</button>
                </div>
                <div id="qrPreview" style="text-align: center; display: none; padding: 15px;">
                    <div id="qrContainer"></div>
                </div>
            </div>
        </div>

        <div class="tool">
            <h2>🧮 Percentage Calculator</h2>
            <div class="grid">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <input type="number" id="percentA" placeholder="Value A">
                    <input type="number" id="percentB" placeholder="Value B">
                </div>
                <div class="buttons">
                    <button onclick="calcPercent()" title="A % of B?">A % B = ?</button>
                    <button onclick="calcValue()" title="A is what % of B?">A = ?% B</button>
                    <button onclick="calcChange()" title="% change from A to B?">A% → B%</button>
                </div>
                <div id="percentResult" style="font-size: 14px; margin-top: 8px; font-weight: bold;"></div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const stats = document.getElementById('stats');

        function updateStats() {
            const text = input.value;
            const chars = text.length;
            const noSpace = text.replace(/\s/g, '').length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            stats.innerHTML = `${chars} (${noSpace}) chars<br>${words} words`;
        }

        function transform(fn) {
            input.value = fn(input.value);
            updateStats();
        }

        input.addEventListener('input', updateStats);

        function paste() {
            navigator.clipboard.readText().then(t => { input.value += t; updateStats(); });
        }

        function removeTracking() {
            transform(x => x.replace(/[?&](utm_\w+|fbclid|gclid|msclkid|[a-z]+id)[^&]*/gi, '')
                .replace(/\?&|&&/g, m => m === '?&' ? '?' : '&').replace(/[?&]$/, ''));
        }

        function sortLines() {
            transform(x => x.split('\n').sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).join('\n'));
        }

        function copy() { navigator.clipboard.writeText(input.value); }

        function generateICS() {
            const title = document.getElementById('eventTitle').value || 'Event';
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const type = document.getElementById('durationType').value;

            if (!date) return alert('Select a date');

            const [y, m, d] = date.split('-');
            const now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0];
            let dtStart, dtEnd;

            if (type === 'allday') {
                dtStart = `${y}${m}${d}`;
                const nd = new Date(y, m - 1, +d + 1);
                dtEnd = `${nd.getFullYear()}${String(nd.getMonth() + 1).padStart(2, '0')}${String(nd.getDate()).padStart(2, '0')}`;
            } else if (type === 'days') {
                const ed = document.getElementById('eventEndDate').value;
                if (!ed) return alert('Select end date');
                const [ey, em, ed_d] = ed.split('-');
                const nd = new Date(ey, em - 1, +ed_d + 1);
                dtStart = `${y}${m}${d}`;
                dtEnd = `${nd.getFullYear()}${String(nd.getMonth() + 1).padStart(2, '0')}${String(nd.getDate()).padStart(2, '0')}`;
            } else {
                const [h, min] = time ? time.split(':') : ['00', '00'];
                dtStart = `${y}${m}${d}T${h}${min}00`;
                dtEnd = `${y}${m}${d}T${String((+h + 1) % 24).padStart(2, '0')}${min}00`;
            }

            const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Toolbox//EN\nBEGIN:VEVENT\nUID:${Date.now()}@local\nDTSTAMP:${now}Z\nDTSTART${type !== 'hours' ? ';VALUE=DATE' : ''}:${dtStart}\nDTEND${type !== 'hours' ? ';VALUE=DATE' : ''}:${dtEnd}\nSUMMARY:${title}\nEND:VEVENT\nEND:VCALENDAR`;

            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
            a.download = `${title.replace(/\s+/g, '_')}.ics`;
            a.click();
        }

        function toggleDurationOptions() {
            const t = document.getElementById('durationType').value;
            document.querySelector('.timeContainer').className = t === 'hours' ? '' : 'hidden';
            document.querySelector('.endDateContainer').className = t === 'days' ? 'endDateContainer' : 'endDateContainer hidden';
        }

        let currentImage = null;
        let currentImageName = '';

        function handleDrop(e) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length) processImage(files[0]);
        }

        function handleImageSelect(e) {
            if (e.target.files.length) processImage(e.target.files[0]);
        }

        function processImage(file) {
            currentImageName = file.name.split('.')[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    currentImage = canvas;
                    document.getElementById('imageWidth').value = img.width;
                    document.getElementById('imageHeight').value = img.height;
                    document.getElementById('imagePreview').src = canvas.toDataURL();
                    document.getElementById('imagePreview').style.display = 'block';
                    document.getElementById('imageControls').style.display = 'block';
                    document.getElementById('imageButtons').style.display = 'flex';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function convertImage(format) {
            if (!currentImage) return;
            const w = parseInt(document.getElementById('imageWidth').value) || currentImage.width;
            const h = parseInt(document.getElementById('imageHeight').value) || currentImage.height;
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(currentImage, 0, 0, w, h);
            canvas.toBlob(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${currentImageName}.${format}`;
                a.click();
            }, `image/${format}`, format === 'jpg' ? 0.95 : undefined);
        }

        function calcPercent() {
            const a = parseFloat(document.getElementById('percentA').value);
            const b = parseFloat(document.getElementById('percentB').value);
            if (isNaN(a) || isNaN(b)) return;
            const result = (a / 100) * b;
            document.getElementById('percentResult').textContent = `${a}% of ${b} = ${result.toFixed(2)}`;
        }

        function calcValue() {
            const a = parseFloat(document.getElementById('percentA').value);
            const b = parseFloat(document.getElementById('percentB').value);
            if (isNaN(a) || isNaN(b) || b === 0) return;
            const result = (a / b) * 100;
            document.getElementById('percentResult').textContent = `${a} is ${result.toFixed(2)}% of ${b}`;
        }

        function calcChange() {
            const a = parseFloat(document.getElementById('percentA').value);
            const b = parseFloat(document.getElementById('percentB').value);
            if (isNaN(a) || isNaN(b) || a === 0) return;
            const result = ((b - a) / a) * 100;
            const type = result > 0 ? 'increase' : 'decrease';
            document.getElementById('percentResult').textContent = `${Math.abs(result).toFixed(2)}% ${type} from ${a} to ${b}`;
        }

        function toggleQrInputs() {
            const type = document.getElementById('qrType').value;
            document.getElementById('qrTextInput').classList.toggle('hidden', type !== 'text');
            document.getElementById('qrVcardInputs').classList.toggle('hidden', type !== 'vcard');
            document.getElementById('qrWifiInputs').classList.toggle('hidden', type !== 'wifi');
            document.getElementById('qrEventInputs').classList.toggle('hidden', type !== 'event');
        }

        function buildQrString() {
            const type = document.getElementById('qrType').value;
            
            if (type === 'text') {
                return document.getElementById('qrTextInput').value.trim();
            }
            
            if (type === 'vcard') {
                const name = document.getElementById('vcardName').value || 'Name Surname';
                const phone = document.getElementById('vcardPhone').value || '+1234567890';
                const email = document.getElementById('vcardEmail').value || 'email@something.com';
                const org = document.getElementById('vcardOrg').value;
                const url = document.getElementById('vcardUrl').value;
                
                let vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nEMAIL:${email}`;
                if (org) vcard += `\nORG:${org}`;
                if (url) vcard += `\nURL:${url}`;
                vcard += '\nEND:VCARD';
                return vcard;
            }
            
            if (type === 'wifi') {
                const name = document.getElementById('wifiName').value || 'Network Name';
                const password = document.getElementById('wifiPassword').value || 'Password';
                const security = document.getElementById('wifiSecurity').value;
                return `WIFI:T:${security};S:${name};P:${password};;`;
            }
            
            if (type === 'event') {
                const title = document.getElementById('eventTitle').value || 'Event Title';
                const startInput = document.getElementById('eventStart').value;
                const endInput = document.getElementById('eventEnd').value;
                const desc = document.getElementById('eventDesc').value;
                
                const start = startInput ? startInput.replace(/[T:-]/g, '').slice(0, 15) + 'Z' : '20260211T100000Z';
                const end = endInput ? endInput.replace(/[T:-]/g, '').slice(0, 15) + 'Z' : '20260211T110000Z';
                
                let event = `BEGIN:VEVENT\nDTSTART:${start}\nDTEND:${end}\nSUMMARY:${title}`;
                if (desc) event += `\nDESCRIPTION:${desc}`;
                event += '\nEND:VEVENT';
                return event;
            }
        }

        function generateQR() {
            const input = buildQrString();
            if (!input) return alert('Fill in the required fields');
            
            const container = document.getElementById('qrContainer');
            container.innerHTML = '';
            
            new QRCode(container, {
                text: input,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.L
            });
            
            document.getElementById('qrPreview').style.display = 'block';
        }

        function downloadQR() {
            const input = buildQrString();
            if (!input) return alert('Generate QR code first');
            
            const canvas = document.createElement('canvas');
            new QRCode(canvas, {
                text: input,
                width: 1024,
                height: 1024,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.L
            });
            
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'qrcode.png';
                a.click();
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', () => toggleQrInputs());
    </script>
</body>
</html>
